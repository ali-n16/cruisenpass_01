name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build deployable site
        run: npm run build

      - name: Install validators
        run: npm install --no-save html-validate

      - name: HTML validation
        run: |
          for f in index.html learn-now.html join-cruisenpass.html privacy.html; do
            echo "::group::$f"
            npx html-validate "$f"
            echo "::endgroup::"
          done

      - name: Required files
        run: |
          for f in index.html learn-now.html join-cruisenpass.html privacy.html sitemap.xml robots.txt; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All required files present."

      - name: Check that referenced files exist
        run: |
          node scripts/check-local-refs.mjs

      - name: Internal link check (local only)
        run: |
          node scripts/check-local-refs.mjs
          node scripts/check-anchor-refs.mjs

      - name: SEO sanity
        run: node scripts/check-jsonld.mjs && node scripts/seo-check.mjs
  status:
    name: Status check
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Fail if validate failed
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "Validation failed."
            exit 1
          fi

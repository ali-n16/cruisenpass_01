name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build deployable site
        run: npm run build

      # Single source of truth for validation: html-validate (all pages),
      # local refs, anchors, JSON-LD, CSP, SEO checks, generator regressions.
      - name: Validate
        run: npm run check

      - name: Required files
        run: |
          for f in index.html learn-now.html join-cruisenpass.html privacy.html sitemap.xml robots.txt; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All required files present."

      - name: External link check (best effort)
        continue-on-error: true
        run: npm run check:links

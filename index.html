  <script>
    (function () {
      var track = document.getElementById('ig-track');
      var prevBtn = document.getElementById('ig-prev');
      var nextBtn = document.getElementById('ig-next');
      var dotsWrap = document.getElementById('ig-dots');
      if (!track) return;

      var cards = Array.from(track.children);
      var slideIndex = 0;

      function getCardWidth() {
        var card = cards[0];
        if (!card) return 300;
        var style = window.getComputedStyle(track);
        var gap = parseFloat(style.columnGap || style.gap || 20);
        return card.offsetWidth + gap;
      }

      function visibleCount() {
        var w = window.innerWidth;
        if (w >= 1024) return 3;
        if (w >= 640) return 2;
        return 1;
      }

      function maxIndex() {
        return Math.max(0, cards.length - visibleCount());
      }

      function update() {
        var offset = slideIndex * getCardWidth();
        track.style.transform = 'translateX(-' + offset + 'px)';
        if (prevBtn) {
          prevBtn.style.display = slideIndex > 0 ? 'flex' : 'none';
          prevBtn.disabled = slideIndex <= 0;
        }
        if (nextBtn) {
          nextBtn.style.display = slideIndex < maxIndex() ? 'flex' : 'none';
          nextBtn.disabled = slideIndex >= maxIndex();
        }
        if (dotsWrap) {
          dotsWrap.innerHTML = '';
          var total = maxIndex() + 1;
          for (var i = 0; i < total; i++) {
            var dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'w-2 h-2 rounded-full transition-all ' + (i === slideIndex ? 'bg-brand-accent w-4' : 'bg-slate-300');
            dot.setAttribute('aria-label', 'Slide ' + (i + 1));
            dot.addEventListener('click', (function (idx) {
              return function () { slideIndex = idx; update(); };
            })(i));
            dotsWrap.appendChild(dot);
          }
        }
      }

      if (prevBtn) prevBtn.addEventListener('click', function () { if (slideIndex > 0) { slideIndex--; update(); } });
      if (nextBtn) nextBtn.addEventListener('click', function () { if (slideIndex < maxIndex()) { slideIndex++; update(); } });

      window.addEventListener('resize', update);
      update();
    })();
  </script>
